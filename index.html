<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Ropa - Simulador</title>

  <!-- CSS propio -->
  <link rel="stylesheet" href="./css/style.css">

  <!-- Libreria Toastify JS por CDN -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js" defer></script>

  <!-- Script principal con defer -->
  <script src="./js/main.js" defer></script>
</head>
<body>

  <header>
    <h1>Tienda de Ropa</h1>
  </header>

  <main class="contenedor-principal">
    
    <!-- Formulario para agregar productos -->
    <section class="seccion-formulario">
      <h2>Agregar Producto</h2>
      <form id="formulario-producto">
        <div class="campo">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" placeholder="Ej: Campera" required>
        </div>

        <div class="campo">
          <label for="precio">Precio ($):</label>
          <input type="number" id="precio" placeholder="Ej: 35000" min="1" required>
        </div>

        <div class="campo">
          <label for="stock">Stock:</label>
          <input type="number" id="stock" placeholder="Ej: 10" min="1" required>
        </div>

        <button type="submit" id="btn-agregar">+ Agregar Producto</button>
      </form>
    </section>

    <!-- Catalogo y busqueda -->
    <section class="seccion-catalogo">
      <div class="barra-busqueda">
        <label for="buscador">Buscar producto:</label>
        <input type="text" id="buscador" placeholder="Escribi para filtrar...">
      </div>

      <h2>Catálogo de Productos</h2>

      <!-- Mensaje de carga mientras resuelve el fetch -->
      <p id="texto-cargando" class="texto-cargando">Cargando productos...</p>

      <div id="contenedor-productos" class="grilla-productos">
        <!-- Tarjetas inyectadas dinamicamente -->
      </div>
    </section>

  </main>

</body>
</html>
