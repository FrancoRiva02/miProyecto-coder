<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Ropa - Proyecto Final</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- Toastify JS por CDN -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js" defer></script>

  <!-- SweetAlert2 por CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>

  <!-- Scripts modulares -->
  <script src="js/productos.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>

  <header>
    <h1>Tienda de Ropa</h1>
  </header>

  <main class="contenedor-principal">
    
    <section class="barra-herramientas">
      <div class="campo-busqueda">
        <label for="buscador">Buscar prenda:</label>
        <input type="text" id="buscador" placeholder="Ej: Remera, Buzo...">
      </div>
    </section>

    <div class="panel-tienda">
      
      <!-- Catálogo -->
      <section class="seccion-catalogo">
        <h2>Catálogo Disponible</h2>
        <p id="texto-cargando" class="texto-cargando">Cargando catálogo...</p>
        <div id="contenedor-productos" class="grilla-productos"></div>
      </section>

      <!-- Carrito -->
      <aside class="seccion-carrito">
        <h2>Tu Carrito</h2>
        
        <div id="contenedor-carrito" class="items-carrito"></div>

        <div class="resumen-pago">
          <label for="medio-pago">Medio de pago:</label>
          <select id="medio-pago">
            <option value="efectivo">Efectivo / Transferencia (10% OFF)</option>
            <option value="un-pago">Tarjeta en 1 pago (Precio lista)</option>
            <option value="cuotas">Tarjeta en 3 cuotas (15% recargo)</option>
          </select>

          <div class="linea-total">
            <span>Subtotal:</span>
            <span id="subtotal-monto">$0</span>
          </div>

          <div class="linea-total destacado">
            <span>Total a pagar:</span>
            <span id="total-monto">$0</span>
          </div>

          <div class="botones-carrito">
            <button id="btn-vaciar" class="btn-vaciar">Vaciar Carrito</button>
            <button id="btn-finalizar" class="btn-finalizar">Finalizar Compra</button>
          </div>
        </div>
      </aside>

    </div>

  </main>

</body>
</html>
